name: PR tests

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        id: cargo-test
        shell: bash
        run: |
          set +e
          cargo test --all --color never 2>&1 | tee cargo-test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment test results
        # Forked PRs receive a read-only token, so their results remain in the
        # workflow log if GitHub does not permit creating a comment.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TEST_STATUS: ${{ steps.cargo-test.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('cargo-test-output.txt', 'utf8');
            const passed = process.env.TEST_STATUS === '0';
            const marker = '<!-- cargo-test-results -->';
            const body = [
              marker,
              `## Cargo tests ${passed ? '✅ passed' : '❌ failed'}`,
              '',
              '<details><summary>Test output</summary>',
              '',
              '```text',
              output.slice(-60000),
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail job when tests fail
        if: steps.cargo-test.outputs.status != '0'
        run: exit 1
