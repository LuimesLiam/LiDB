title = "LiDB secret scanning"

[extend]
useDefault = true

[[rules]]
id = "sensitive-value-assignment"
description = "Sensitive value assigned directly in source or configuration"
regex = '''(?i)(api[_-]?key|client[_-]?secret|access[_-]?token|auth[_-]?token|password|passwd|private[_-]?key)\s*[:=]\s*["']?([A-Za-z0-9+/=_\-]{12,})'''
secretGroup = 2
entropy = 3.0
keywords = [
  "api_key",
  "apikey",
  "client_secret",
  "access_token",
  "auth_token",
  "password",
  "passwd",
  "private_key",
]

[[rules.allowlists]]
description = "Permit obvious documentation placeholders"
stopwords = [
  "changeme",
  "example",
  "placeholder",
  "replace_me",
  "your_api_key",
  "your_token",
]
